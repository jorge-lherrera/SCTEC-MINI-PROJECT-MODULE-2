services:
  database:
    image: postgres:18-alpine
    container_name: medclinic-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - medclinic-data:/var/lib/postgresql

volumes:
  medclinic-data:
